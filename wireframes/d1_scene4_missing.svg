<rect x="40" y="315" width="720" height="95" fill="#FFFFFF" stroke="#0071BC" stroke-width="2"/>
<text x="52" y="337" fill="#0071BC" font-size="12" font-weight="bold">→ Suggested fallback</text>
<text x="52" y="357" fill="#112E51" font-size="11">Try the Verification API for enrollment status, or query VADIR for service history.</text>
<rect x="52" y="368" width="180" height="30" fill="#0071BC"/>
