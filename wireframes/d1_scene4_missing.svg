<text x="52" y="192" fill="#5B616B" font-size="10">Patient/v0 API: 200 OK • 421ms</text>

<rect x="40" y="220" width="720" height="80" fill="#FFF8E1" stroke="#FDB81E" stroke-width="2"/>
<text x="52" y="242" fill="#112E51" font-size="12" font-weight="bold">⚠ No active coverage found</text>
<text x="52" y="262" fill="#5B616B" font-size="11">The Health Care Costs &amp; Coverage API returned an empty bundle (total: 0).</text>
<text x="52" y="278" fill="#5B616B" font-size="11">This does NOT mean the Veteran is ineligible — it means this API has nothing on file.</text>
