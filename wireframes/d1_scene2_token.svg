<text x="40" y="100" fill="#112E51" font-size="18" font-weight="bold">Token Revocation Test</text>

<rect x="40" y="130" width="720" height="60" fill="#FFF8E1" stroke="#FDB81E" stroke-width="2"/>
<text x="52" y="152" fill="#112E51" font-size="12" font-weight="bold">⚠ Bearer token forcibly revoked by evaluator</text>
<text x="52" y="172" fill="#5B616B" font-size="11">Next API call will receive HTTP 401 — watch the recovery flow below</text>

<text x="40" y="220" fill="#112E51" font-size="13" font-weight="bold">EVENT LOG</text>

<rect x="40" y="230" width="720" height="180" fill="#0F1419"/>
<text x="52" y="252" fill="#FF6B6B" font-size="11" font-family="monospace">14:22:03  GET /services/fhir/v0/r4/Patient  →  401 Unauthorized</text>
<text x="52" y="272" fill="#FDB81E" font-size="11" font-family="monospace">14:22:03  Token invalid — triggering re-auth</text>
<text x="52" y="292" fill="#4EC9B0" font-size="11" font-family="monospace">14:22:03  POST /oauth2/token  →  200 OK  (new bearer acquired)</text>
<text x="52" y="312" fill="#4EC9B0" font-size="11" font-family="monospace">14:22:04  GET /services/fhir/v0/r4/Patient  →  200 OK (retry succeeded)</text>
<text x="52" y="332" fill="#4EC9B0" font-size="11" font-family="monospace">14:22:04  GET /services/fhir/v0/r4/Coverage  →  200 OK</text>
<text x="52" y="352" fill="#569CD6" font-size="11" font-family="monospace">14:22:04  Eligibility card rendered — Veteran never saw the failure</text>
<text x="52" y="380" fill="#5B616B" font-size="10" font-family="monospace">Total user-facing latency: 1.2s  •  Zero manual intervention</text>

<circle cx="740" cy="70" r="8" fill="#FDB81E"/>
