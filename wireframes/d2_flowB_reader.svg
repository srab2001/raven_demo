<text x="84" y="66" fill="#5B616B" font-size="10">eligibility-wizard.va.gov/step-3</text>
<text x="40" y="105" fill="#5B616B" font-size="11">Step 3 of 3</text>
<rect x="40" y="115" width="300" height="6" fill="#2E8540"/>

<text x="40" y="155" fill="#112E51" font-size="20" font-weight="bold">When did you separate from service?</text>
<text x="40" y="182" fill="#5B616B" font-size="12">We use this to confirm your discharge is recent enough for certain benefits.</text>

<text x="40" y="220" fill="#112E51" font-size="12" font-weight="bold">Separation date</text>
<rect x="40" y="230" width="120" height="42" fill="#FFFFFF" stroke="#5B616B"/>
<text x="52" y="248" fill="#5B616B" font-size="10">Month</text>
<text x="52" y="266" fill="#112E51" font-size="14">03</text>
<rect x="170" y="230" width="120" height="42" fill="#FFFFFF" stroke="#5B616B"/>
<text x="182" y="248" fill="#5B616B" font-size="10">Day</text>
<text x="182" y="266" fill="#112E51" font-size="14">15</text>
<rect x="300" y="230" width="140" height="42" fill="#FFFFFF" stroke="#5B616B"/>
<text x="312" y="248" fill="#5B616B" font-size="10">Year</text>
<text x="312" y="266" fill="#112E51" font-size="14">2021</text>

<rect x="40" y="290" width="440" height="60" fill="#E7F3FE" stroke="#0071BC"/>
<text x="52" y="312" fill="#112E51" font-size="12" font-weight="bold">💾 Saved automatically</text>
<text x="52" y="332" fill="#5B616B" font-size="11">You can close this window and come back — we'll email you a resume link.</text>

<rect x="500" y="140" width="260" height="290" fill="#1A1A1A"/>
<text x="512" y="160" fill="#FDB81E" font-size="11" font-weight="bold">🔊 NVDA SIMULATOR</text>
<text x="512" y="182" fill="#FFFFFF" font-size="10" font-family="monospace">"Step 3 of 3."</text>
<text x="512" y="200" fill="#FFFFFF" font-size="10" font-family="monospace">"Heading, level 1:"</text>
<text x="512" y="216" fill="#FFFFFF" font-size="10" font-family="monospace">"When did you separate</text>
<text x="512" y="232" fill="#FFFFFF" font-size="10" font-family="monospace">from service?"</text>
<text x="512" y="252" fill="#FFFFFF" font-size="10" font-family="monospace">"Group, Separation date."</text>
<text x="512" y="270" fill="#FFFFFF" font-size="10" font-family="monospace">"Edit, Month, 0 3."</text>
<text x="512" y="286" fill="#FFFFFF" font-size="10" font-family="monospace">"Edit, Day, 1 5."</text>
<text x="512" y="302" fill="#FFFFFF" font-size="10" font-family="monospace">"Edit, Year, 2 0 2 1."</text>
<text x="512" y="322" fill="#FFFFFF" font-size="10" font-family="monospace">"Alert: Saved</text>
<text x="512" y="338" fill="#FFFFFF" font-size="10" font-family="monospace">automatically."</text>
<line x1="512" y1="352" x2="748" y2="352" stroke="#5B616B"/>
<text x="512" y="370" fill="#FDB81E" font-size="10" font-weight="bold">Reading Level</text>
<rect x="512" y="378" width="180" height="10" fill="#333"/>
<rect x="512" y="378" width="140" height="10" fill="#2E8540"/>
<text x="512" y="404" fill="#FFFFFF" font-size="10">Flesch-Kincaid: Grade 6.4</text>
<text x="512" y="420" fill="#2E8540" font-size="10">✓ Below 8th-grade target</text>

<text x="40" y="380" fill="#112E51" font-size="11" font-weight="bold">Plain language checks (live)</text>
<text x="40" y="398" fill="#2E8540" font-size="10">✓ One question per screen • ✓ Active voice • ✓ No jargon ("separated" not "MEB'd")</text>
<text x="40" y="414" fill="#2E8540" font-size="10">✓ Progress preserved on close • ✓ Errors announced via aria-live="polite"</text>

