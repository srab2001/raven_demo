<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 445" width="800" height="445" font-family="Arial, sans-serif">
<rect width="800" height="445" fill="#FFFFFF"/>
<rect x="0" y="0" width="800" height="32" fill="#5C2E91"/>
<text x="16" y="21" fill="#FFFFFF" font-size="14" font-weight="bold">Vendor Rigor Console — Scene 4: Gov Email Guardrail</text>

<text x="30" y="65" fill="#112E51" font-size="18" font-weight="bold">Government Email Guardrail — Composer Extension</text>
<text x="30" y="85" fill="#5B616B" font-size="12">Any outbound email to a *.va.gov contact outside PDS Health scans recipients before send</text>

<rect x="30" y="105" width="470" height="315" fill="#FFFFFF" stroke="#5B616B"/>
<rect x="30" y="105" width="470" height="30" fill="#F1F1F1"/>
<text x="42" y="125" fill="#112E51" font-size="11" font-weight="bold">New message</text>
<text x="450" y="125" fill="#5B616B" font-size="11">— □ ×</text>

<text x="42" y="152" fill="#5B616B" font-size="10">To:</text>
<rect x="70" y="140" width="420" height="22" fill="#FFFFFF" stroke="#5B616B"/>
<text x="80" y="156" fill="#112E51" font-size="10">jane.doe@va.gov (Oracle Cutover Program)</text>

<text x="42" y="182" fill="#5B616B" font-size="10">Cc:</text>
<rect x="70" y="170" width="420" height="22" fill="#FFF8E1" stroke="#FDB81E" stroke-width="2"/>
<text x="80" y="186" fill="#FDB81E" font-size="10" font-style="italic">— guardrail suggests adding: pds-health-office@va.gov —</text>

<text x="42" y="212" fill="#5B616B" font-size="10">Subject:</text>
<rect x="90" y="200" width="400" height="22" fill="#FFFFFF" stroke="#5B616B"/>
<text x="100" y="216" fill="#112E51" font-size="10">Follow-up on the Aug cutover — patient portal impact</text>

<rect x="42" y="232" width="448" height="130" fill="#FFFFFF" stroke="#5B616B"/>
<text x="52" y="252" fill="#112E51" font-size="10">Hi Jane,</text>
<text x="52" y="272" fill="#112E51" font-size="10">Following up on our discussion re: the Oracle</text>
<text x="52" y="288" fill="#112E51" font-size="10">cutover window and downstream patient portal</text>
<text x="52" y="304" fill="#112E51" font-size="10">effects. We propose ...</text>

<rect x="42" y="372" width="80" height="32" fill="#5B616B"/>
<text x="60" y="392" fill="#FFFFFF" font-size="11" font-weight="bold">Send</text>
<text x="132" y="392" fill="#5B616B" font-size="10">↑ blocked until CC is resolved</text>

<rect x="520" y="105" width="250" height="315" fill="#FFF8E1" stroke="#FDB81E" stroke-width="2"/>
<text x="532" y="128" fill="#112E51" font-size="12" font-weight="bold">⚠ Guardrail Notice</text>
<text x="532" y="152" fill="#112E51" font-size="11">Recipient jane.doe@va.gov is</text>
<text x="532" y="168" fill="#112E51" font-size="11">outside PDS Health: Patient &amp;</text>
<text x="532" y="184" fill="#112E51" font-size="11">Clinical Experience.</text>

<text x="532" y="212" fill="#112E51" font-size="11" font-weight="bold">Policy:</text>
<text x="532" y="228" fill="#5B616B" font-size="10">Include a PDS Health contact</text>
<text x="532" y="242" fill="#5B616B" font-size="10">on Cc before sending.</text>

<rect x="532" y="258" width="226" height="30" fill="#2E8540"/>
<text x="548" y="278" fill="#FFFFFF" font-size="11" font-weight="bold">✓ Add pds-health-office@va.gov</text>

<rect x="532" y="294" width="226" height="30" fill="#FFFFFF" stroke="#5B616B"/>
<text x="548" y="314" fill="#112E51" font-size="11">Add a different PDS contact...</text>

<rect x="532" y="330" width="226" height="30" fill="#FFFFFF" stroke="#B50909"/>
<text x="548" y="350" fill="#B50909" font-size="11">Override (log + justify)</text>

<text x="532" y="380" fill="#5B616B" font-size="9">All sends logged • Overrides visible</text>
<text x="532" y="394" fill="#5B616B" font-size="9">in weekly PDS Health digest</text>
<text x="532" y="408" fill="#5B616B" font-size="9">Zero-surprise policy enforced</text>

</svg>