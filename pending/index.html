<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Awaiting approval — RAVEN/SQUARES demos" />
    <link rel="icon" href="data:," />
    <title>Awaiting approval — RAVEN/SQUARES Demos</title>
    <style>
      :root { color: #13233f; background: #eef3f8; font-family: Georgia, 'Times New Roman', serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
      main { max-width: 460px; margin: 0 auto; padding: 48px 32px; background: white; border-radius: 1rem; box-shadow: 0 10px 30px rgba(15, 23, 42, 0.1); text-align: center; }
      .label { color: #b45309; font-family: Arial, sans-serif; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; }
      h1 { font-size: 1.8rem; font-weight: 500; margin: 12px 0 20px; }
      p { color: #475569; line-height: 1.5; }
      .actions { display: flex; gap: 0.75rem; justify-content: center; margin-top: 1.5rem; flex-wrap: wrap; }
      a.button { font-family: Arial, sans-serif; font-weight: 700; padding: 0.75rem 1.25rem; border-radius: 999px; text-decoration: none; }
      a.primary { background: #0071bc; color: white; }
      a.secondary { background: #e2e8f0; color: #13233f; }
      a.button:hover, a.button:focus-visible { outline: 3px solid #cbe8ff; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <p class="label">Awaiting approval</p>
      <h1>You're signed in, but not approved yet</h1>
      <p>An admin needs to approve your account before you can view the demos. Check back shortly, or ask whoever invited you to approve your email in the admin panel.</p>
      <div class="actions">
        <a class="button primary" href="/">Check again</a>
        <a class="button secondary" href="/api/auth/signout">Sign out</a>
      </div>
    </main>
  </body>
</html>
